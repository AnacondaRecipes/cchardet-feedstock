{% set name = "cchardet" %}
{% set version = "2.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e08fade06af9aa4888ad99609a66bbce99ad01c1269c0ea673af75a15a6f762e

build:
  number: 0
  # pyproject.toml: requires-python = ">=3.11"
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vvv
  entry_points:
    - cchardetect = cchardet.cli.cchardetect:main

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools >=77
    - cython >=3.2.9,<3.4
  run:
    - python

test:
  source_files:
    - tests/test_cli.py
  requires:
    - pip
    - pytest
  imports:
    - cchardet
    - cchardet.cli
  commands:
    - pip check
    - cchardetect --version
    - pytest -v tests/test_cli.py

about:
  home: https://github.com/PyYoshi/cChardet
  license_file: COPYING
  # Bundled uchardet is the Mozilla tri-license (MPL 1.1/GPL 2.0/LGPL 2.1, pick one);
  # matches pyproject.toml `license` and the uchardet source headers.
  license: MPL-1.1 OR GPL-2.0-or-later OR LGPL-2.1-or-later
  license_family: OTHER
  summary: cChardet is high speed universal character encoding detector
  description: |
    cChardet is high speed universal character encoding detector. - binding to uchardet.
  dev_url: https://github.com/PyYoshi/cChardet
  doc_url: https://github.com/PyYoshi/cChardet

extra:
  recipe-maintainers:
    - pmlandwehr
    - Ryan-Dmello
